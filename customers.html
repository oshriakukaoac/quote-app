<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לקוחות – מערכת הצעות מחיר</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="container">
  <div class="card-header">
    <h1>ניהול לקוחות</h1>
    <a href="customer-import.html" class="btn">📥 ייבוא לקוחות מ-Finbot</a>
  </div>

  <div class="card" id="formCard">
    <div class="card-header"><h2 id="formTitle">לקוח חדש</h2></div>
    <input type="hidden" id="custId">
    <div class="grid cols-2">
      <div class="field"><label>שם הלקוח / חברה *</label><input type="text" id="custName"></div>
      <div class="field"><label>עוסק מורשה / ח.פ.</label><input type="text" id="custTaxId"></div>
      <div class="field"><label>כתובת</label><input type="text" id="custAddress"></div>
      <div class="field"><label>איש קשר</label><input type="text" id="custContact"></div>
      <div class="field"><label>טלפון</label><input type="tel" id="custPhone"></div>
      <div class="field"><label>אימייל</label><input type="email" id="custEmail"></div>
    </div>
    <div class="btn-row">
      <button class="btn primary" onclick="saveCustomer()">שמירה</button>
      <button class="btn ghost" onclick="resetForm()">ניקוי טופס</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h2>רשימת לקוחות</h2></div>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>שם</th><th>עוסק מס'</th><th>טלפון</th><th>אימייל</th><th></th></tr></thead>
        <tbody id="custBody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script src="js/customers.js"></script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>איפוס סיסמה – מערכת הצעות מחיר</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--c-primary-dark),var(--c-primary));}
  .box{width:100%;max-width:380px;padding:0 16px;}
  .card2{background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:32px 28px;}
  .login-logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--c-primary),var(--c-primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;margin:0 auto 14px;}
  .login-err{background:var(--c-danger-bg);color:var(--c-danger);border-radius:8px;padding:9px 12px;font-size:.85rem;margin-bottom:14px;display:none;}
  .login-info{background:var(--c-primary-light);color:var(--c-primary-dark);border-radius:8px;padding:9px 12px;font-size:.85rem;margin-bottom:14px;display:none;}
</style>
</head>
<body>
<div class="box">
  <div class="card2">
    <div class="login-logo">OAC</div>
    <h1 style="text-align:center;font-size:1.2rem;">קביעת סיסמה חדשה</h1>
    <div class="login-err" id="errBox"></div>
    <div class="login-info" id="infoBox"></div>
    <div id="formArea" style="display:none;">
      <div class="field"><label>סיסמה חדשה</label><input type="password" id="newPassword" autocomplete="new-password"></div>
      <div class="field"><label>אימות סיסמה</label><input type="password" id="newPassword2" autocomplete="new-password"></div>
      <button class="btn primary" id="saveBtn" onclick="handleUpdatePassword()" style="width:100%;justify-content:center;">שמירת סיסמה חדשה</button>
    </div>
    <p class="muted" style="text-align:center;"><a href="login.html">חזרה להתחברות</a></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-common.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>

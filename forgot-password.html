<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שכחתי סיסמה – מערכת הצעות מחיר</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--c-primary-dark),var(--c-primary));}
  .login-box{width:100%;max-width:380px;padding:0 16px;}
  .login-card{background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:32px 28px;}
  .login-logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--c-primary),var(--c-primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;margin:0 auto 14px;}
  .login-title{text-align:center;margin-bottom:22px;}
  .login-title h1{font-size:1.25rem;margin-bottom:2px;}
  .login-err{background:var(--c-danger-bg);color:var(--c-danger);border-radius:8px;padding:9px 12px;font-size:.85rem;margin-bottom:14px;display:none;}
  .login-info{background:var(--c-primary-light);color:var(--c-primary-dark);border-radius:8px;padding:9px 12px;font-size:.85rem;margin-bottom:14px;display:none;}
  .login-switch{text-align:center;margin-top:14px;font-size:.86rem;}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-card">
    <div class="login-logo">OAC</div>
    <div class="login-title"><h1>איפוס סיסמה</h1></div>

    <div class="login-err" id="errBox"></div>
    <div class="login-info" id="infoBox"></div>

    <div id="formArea">
      <p class="muted" style="margin-top:0;">נשלח אליכם קישור לאיפוס סיסמה למייל שהזנתם.</p>
      <div class="field"><label>אימייל</label><input type="email" id="email" autocomplete="username"></div>
      <button class="btn primary" id="mainActionBtn" onclick="handleForgotPassword()" style="width:100%;justify-content:center;">שליחת קישור לאיפוס</button>
      <div class="login-switch"><a href="login.html">חזרה להתחברות</a></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-common.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>

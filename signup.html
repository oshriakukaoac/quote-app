<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הצעות מחיר">
<meta name="theme-color" content="#1a4f8b">
<title>הרשמה – מערכת הצעות מחיר</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--c-primary-dark),var(--c-primary));padding:24px 0;}
  .login-box{width:100%;max-width:420px;padding:0 16px;}
  .login-card{background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:32px 28px;}
  .login-logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--c-primary),var(--c-primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;margin:0 auto 14px;}
  .login-title{text-align:center;margin-bottom:20px;}
  .login-title h1{font-size:1.25rem;margin-bottom:2px;}
  .login-title p{color:var(--c-text-muted);font-size:.85rem;margin:0;}
  .login-err{background:var(--c-danger-bg);color:var(--c-danger);border-radius:8px;padding:9px 12px;font-size:.85rem;margin-bottom:14px;display:none;}
  .login-info{background:var(--c-primary-light);color:var(--c-primary-dark);border-radius:8px;padding:9px 12px;font-size:.85rem;margin-bottom:14px;display:none;}
  .login-switch{text-align:center;margin-top:14px;font-size:.86rem;}
  .name-row{display:flex;gap:10px;}
  .name-row .field{flex:1;}
  .progress-wrap{height:6px;background:var(--c-border);border-radius:4px;overflow:hidden;margin:4px 0 16px;display:none;}
  .progress-bar{height:100%;width:0%;background:var(--c-success);transition:width .35s ease;}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-card">
    <div class="login-logo">OAC</div>
    <div class="login-title">
      <h1>יצירת חשבון</h1>
      <p>מערכת הצעות מחיר</p>
    </div>

    <div class="login-err" id="errBox"></div>
    <div class="login-info" id="infoBox"></div>
    <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>

    <div id="formArea">
      <div class="name-row">
        <div class="field"><label>שם פרטי</label><input type="text" id="firstName" autocomplete="given-name"></div>
        <div class="field"><label>שם משפחה</label><input type="text" id="lastName" autocomplete="family-name"></div>
      </div>
      <div class="field"><label>אימייל</label><input type="email" id="email" autocomplete="username"></div>
      <div class="field"><label>טלפון</label><input type="tel" id="phone" autocomplete="tel"></div>
      <div class="field"><label>סיסמה (לפחות 6 תווים)</label><input type="password" id="password" autocomplete="new-password"></div>
      <div class="field"><label>אימות סיסמה</label><input type="password" id="password2" autocomplete="new-password"></div>
      <button class="btn primary" id="mainActionBtn" onclick="handleSignUp()" style="width:100%;justify-content:center;">הרשמה</button>
      <div class="login-switch"><span class="muted">כבר יש לך חשבון?</span> <a href="login.html">התחברות</a></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-common.js"></script>
<script src="js/signup.js"></script>
</body>
</html>

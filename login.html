<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הצעות מחיר">
<meta name="theme-color" content="#1a4f8b">
<title>התחברות – מערכת הצעות מחיר</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--c-primary-dark),var(--c-primary));}
  .login-box{width:100%;max-width:380px;padding:0 16px;}
  .login-card{background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:32px 28px;}
  .login-logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--c-primary),var(--c-primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;margin:0 auto 14px;}
  .login-title{text-align:center;margin-bottom:22px;}
  .login-title h1{font-size:1.25rem;margin-bottom:2px;}
  .login-title p{color:var(--c-text-muted);font-size:.85rem;margin:0;}
  .login-err{background:var(--c-danger-bg);color:var(--c-danger);border-radius:8px;padding:9px 12px;font-size:.85rem;margin-bottom:14px;display:none;}
  .login-info{background:var(--c-primary-light);color:var(--c-primary-dark);border-radius:8px;padding:9px 12px;font-size:.85rem;margin-bottom:14px;display:none;}
  .login-switch{text-align:center;margin-top:14px;font-size:.86rem;}
  #mfaStep{display:none;}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-card">
    <div class="login-logo">OAC</div>
    <div class="login-title">
      <h1 id="titleText">התחברות למערכת</h1>
      <p>מערכת הצעות מחיר</p>
    </div>

    <div class="login-err" id="errBox"></div>
    <div class="login-info" id="infoBox"></div>

    <div id="credsStep">
      <div class="field"><label>אימייל</label><input type="email" id="email" autocomplete="username"></div>
      <div class="field"><label>סיסמה</label><input type="password" id="password" autocomplete="current-password"></div>
      <button class="btn primary" id="mainActionBtn" onclick="handleSignIn()" style="width:100%;justify-content:center;">התחברות</button>
      <div class="login-switch"><a href="forgot-password.html">שכחתי סיסמה</a></div>
      <div class="login-switch"><span class="muted">אין לך עדיין חשבון?</span> <a href="signup.html">הרשמה</a></div>
    </div>

    <div id="mfaStep">
      <p class="muted" style="margin-top:0;">הזינו את הקוד בן 6 הספרות מאפליקציית האימות (Google Authenticator / Authy וכו').</p>
      <div class="field"><label>קוד אימות</label><input type="text" id="mfaCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
      <button class="btn primary" id="mfaBtn" onclick="handleMfaVerify()" style="width:100%;justify-content:center;">אימות והתחברות</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-common.js"></script>
<script src="js/login.js"></script>
</body>
</html>

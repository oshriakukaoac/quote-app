<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הודעת וואטסאפ – מערכת הצעות מחיר</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="container">
  <h1>יצירת הודעת וואטסאפ ללקוח</h1>
  <p class="muted">בחרו הצעת מחיר קיימת או מוצרים מהקטלוג — המערכת תרכיב הודעה מוכנה להעתקה ולשליחה.</p>

  <div class="card">
    <div class="card-header"><h2>הודעה מתוך הצעת מחיר</h2></div>
    <div class="row">
      <div class="field"><label>בחירת הצעה</label><select id="quoteSelect"><option value="">בחרו הצעת מחיר...</option></select></div>
      <div class="field"><label>טלפון הלקוח</label><input type="tel" id="customerPhone" placeholder="לדוגמה: 0501234567"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h2>בחירת מוצרים</h2></div>
    <div class="chip-list" id="productChips"></div>
  </div>

  <div class="card">
    <div class="checkbox-row" style="margin-bottom:14px;">
      <input type="checkbox" id="includePrice">
      <label for="includePrice" style="margin:0;">לכלול מחיר (כולל מע"מ) בהודעה</label>
    </div>
    <div class="card-header"><h2>ההודעה המוכנה</h2>
      <div class="btn-row">
        <button class="btn primary" onclick="copyMessage()">📋 העתקת ההודעה</button>
        <button class="btn whatsapp-btn" onclick="sendWhatsApp()">פתיחה ב‑WhatsApp</button>
      </div>
    </div>
    <textarea id="messageOut" rows="16"></textarea>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script src="js/whatsapp.js"></script>
</body>
</html>
